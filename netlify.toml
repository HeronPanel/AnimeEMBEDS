[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

[[redirects]]
  from = "/api/sync-status"
  to = "/.netlify/functions/catalog?action=status"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/catalog"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
