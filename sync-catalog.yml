name: Sync anime catalog

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync from API
        run: node scripts/sync.js
      - name: Commit changes
        run: |
          git config user.name "anime-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: auto-sync anime catalog"
            git push
          fi
