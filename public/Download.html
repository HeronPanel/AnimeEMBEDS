<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download AnimeEmbeds</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Inter, Arial, sans-serif;
    background:
        radial-gradient(circle at 50% -20%, rgba(168,85,247,.18), transparent 35%),
        radial-gradient(circle at 10% 80%, rgba(120,50,220,.08), transparent 30%),
        #101010;
    color: white;
    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            120deg,
            transparent 0%,
            rgba(168,85,247,.025) 45%,
            rgba(255,255,255,.025) 50%,
            transparent 55%
        );
    background-size: 300% 300%;
    animation: bgMove 12s linear infinite;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}

/* =========================
   CURSOR GLOW
========================= */

.cursor-glow {
    position: fixed;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(
        circle,
        rgba(168,85,247,.10),
        transparent 65%
    );
    transform: translate(-50%, -50%);
    z-index: 0;
    filter: blur(15px);
}

/* =========================
   FLOATING ORBS
========================= */

.orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(70px);
    opacity: .15;
    z-index: 0;
}

.orb.one {
    width: 280px;
    height: 280px;
    background: #8b5cf6;
    left: -100px;
    top: 25%;
    animation: orbOne 10s ease-in-out infinite alternate;
}

.orb.two {
    width: 220px;
    height: 220px;
    background: #c084fc;
    right: -70px;
    top: 55%;
    animation: orbTwo 13s ease-in-out infinite alternate;
}

@keyframes orbOne {
    from { transform: translate(0,0); }
    to { transform: translate(100px,-80px); }
}

@keyframes orbTwo {
    from { transform: translate(0,0); }
    to { transform: translate(-100px,70px); }
}

/* =========================
   MAIN
========================= */

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 80px;
}

/* =========================
   TITLE
========================= */

.title {
    font-size: 31px;
    font-weight: 800;
    letter-spacing: -1.5px;
    opacity: 0;
    animation: titleIn 1s cubic-bezier(.2,.8,.2,1) forwards;
}

.title .white {
    color: #fff;
}

.title .purple {
    color: #a855f7;
    text-shadow:
        0 0 12px rgba(168,85,247,.35),
        0 0 35px rgba(168,85,247,.12);
}

@keyframes titleIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
        filter: blur(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

/* =========================
   SUBTITLE
========================= */

.subtitle {
    margin-top: 10px;
    color: #777;
    font-size: 13px;
    letter-spacing: .5px;
    opacity: 0;
    animation: fadeUp 1s .25s forwards;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   DOWNLOAD GRID
========================= */

.downloads {
    width: min(900px, 100%);
    margin-top: 55px;
    display: grid;
    grid-template-columns: minmax(280px, 430px);
    justify-content: center;
    gap: 25px;
}

/* =========================
   CARD
========================= */

.card {
    position: relative;
    min-height: 260px;
    overflow: hidden;
    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(255,255,255,.09);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.07);

    opacity: 0;

    animation:
        cardIn .9s cubic-bezier(.2,.8,.2,1) forwards;

    transition:
        transform .5s cubic-bezier(.2,.8,.2,1),
        border-color .5s ease,
        box-shadow .5s ease;
}

.card:nth-child(2) {
    animation-delay: .15s;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(45px) scale(.94);
        filter: blur(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

/* Card glow */

.card::before {
    content: "";
    position: absolute;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: #a855f7;
    filter: blur(100px);
    opacity: 0;
    transition: .6s ease;
}

.card:hover::before {
    opacity: .13;
}

/* Shine */

.card::after {
    content: "";
    position: absolute;
    width: 160%;
    height: 50%;
    top: -100%;
    left: -30%;
    transform: rotate(-12deg);

    background: linear-gradient(
        transparent,
        rgba(255,255,255,.09),
        transparent
    );

    transition: top .8s ease;
}

.card:hover::after {
    top: 130%;
}

/* Hover */

.card:hover {
    transform: translateY(-12px) scale(1.025);

    border-color: rgba(168,85,247,.55);

    box-shadow:
        0 35px 90px rgba(0,0,0,.45),
        0 0 45px rgba(168,85,247,.12),
        inset 0 1px 0 rgba(255,255,255,.12);
}

/* =========================
   ICON
========================= */

.icon-box {
    position: relative;
    width: 86px;
    height: 86px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.1),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(255,255,255,.1);

    box-shadow:
        0 15px 35px rgba(0,0,0,.3);

    transition:
        transform .55s cubic-bezier(.2,.8,.2,1),
        box-shadow .55s ease;
}

.card:hover .icon-box {
    transform:
        translateY(-8px)
        rotateX(8deg)
        rotateY(-8deg)
        scale(1.08);

    box-shadow:
        0 20px 45px rgba(0,0,0,.4),
        0 0 30px rgba(168,85,247,.16);
}

.icon {
    width: 52px;
    height: 52px;

    transition:
        transform .6s cubic-bezier(.2,.8,.2,1);
}

.card:hover .icon {
    transform: scale(1.1);
}

/* =========================
   TEXT
========================= */

.name {
    margin-top: 22px;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -.4px;

    transition: .4s ease;
}

.card:hover .name {
    color: #c084fc;
    text-shadow: 0 0 20px rgba(168,85,247,.3);
}

.download-text {
    margin-top: 7px;
    color: #777;
    font-size: 12px;

    transition: .4s ease;
}

.card:hover .download-text {
    color: #aaa;
}

/* =========================
   PURPLE LINE
========================= */

.line {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    transform: translateX(-50%);

    background: #a855f7;
    box-shadow: 0 0 18px #a855f7;

    transition: width .5s ease;
}

.card:hover .line {
    width: 55%;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .title {
        font-size: 28px;
    }

    .downloads {
        grid-template-columns: 1fr;
        margin-top: 40px;
    }

    .card {
        min-height: 235px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="cursor-glow"></div>

<div class="orb one"></div>
<div class="orb two"></div>

<main class="container">

    <div class="title">
        <span class="white">Down</span><span class="purple">load</span>
    </div>

    <div class="subtitle">
        Choose your platform
    </div>

    <section class="downloads">

        <!-- WINDOWS -->
        <div class="card" onclick="downloadWindows()">

            <div class="icon-box">

                <svg class="icon" viewBox="0 0 24 24">
                    <path
                        fill="#00A4EF"
                        d="M2 4.2L10.5 3v8.3H2V4.2ZM11.5 2.85L22 1.5v9.8H11.5V2.85ZM2 12.7h8.5V21L2 19.8v-7.1ZM11.5 12.7H22v9.8l-10.5-1.45V12.7Z"
                    />
                </svg>

            </div>

            <div class="name">Windows</div>

            <div class="download-text">
                Download for Windows
            </div>

            <div class="line"></div>

        </div>


    </section>

</main>


<script>

/* =========================
   CURSOR LIGHT
========================= */

const glow = document.querySelector(".cursor-glow");

document.addEventListener("mousemove", (e) => {

    glow.animate(
        {
            left: `${e.clientX}px`,
            top: `${e.clientY}px`
        },
        {
            duration: 450,
            fill: "forwards",
            easing: "ease-out"
        }
    );

});


/* =========================
   DOWNLOADS
========================= */

function downloadWindows() {
    window.location.href = "animeembeds.exe";
}


/* =========================
   CARD TILT
========================= */

document.querySelectorAll(".card").forEach(card => {

    card.addEventListener("mousemove", (e) => {

        const rect = card.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX =
            ((y - centerY) / centerY) * -4;

        const rotateY =
            ((x - centerX) / centerX) * 4;

        card.style.transform =
            `perspective(900px)
             translateY(-12px)
             scale(1.025)
             rotateX(${rotateX}deg)
             rotateY(${rotateY}deg)`;

    });

    card.addEventListener("mouseleave", () => {

        card.style.transform = "";

    });

});

</script>

</body>
</html>
