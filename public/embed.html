<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ToonFLIX Embed</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #embed-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
    #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
           color: #fff; font: 600 16px/1.5 system-ui, sans-serif; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <iframe id="embed-frame" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  <div id="msg">Invalid embed link.<br>Use: /watch/TMDB_ID/EPISODE/embed</div>

  <script>
    (function () {
      var frame = document.getElementById('embed-frame');
      var msg = document.getElementById('msg');

      // Supports: /watch/31/1/embed  (main pattern)
      //           embed.html#/watch/31/1   and   embed.html?id=31&ep=1
      function parse() {
        var m = location.pathname.match(/^\/watch\/([^\/]+)\/([^\/]+)\/embed\/?$/);
        if (m) return { id: decodeURIComponent(m[1]), ep: decodeURIComponent(m[2]) };
        m = location.hash.match(/^#\/watch\/([^\/?#]+)\/([^\/?#]+)/);
        if (m) return { id: m[1], ep: m[2] };
        var q = new URLSearchParams(location.search);
        if (q.get('id')) return { id: q.get('id'), ep: q.get('ep') || '1' };
        return null;
      }

      function load() {
        var d = parse();
        if (!d) { frame.style.display = 'none'; msg.style.display = 'flex'; return; }
        msg.style.display = 'none';
        frame.style.display = 'block';
        // main site ka embed-mode (sirf fullscreen player) same folder ke index.html me hai
        var src = '/index.html#/watch/' + encodeURIComponent(d.id) + '/' + encodeURIComponent(d.ep) + '/embed';
        if (frame.getAttribute('data-src') !== src) {
          frame.setAttribute('data-src', src);
          frame.src = src;
        }
      }

      window.addEventListener('hashchange', load);
      load();
    })();
  </script>
</body>
</html>
