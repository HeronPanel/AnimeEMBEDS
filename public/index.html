<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIME EMBED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Cinema Lounge — MIDNIGHT AMETHYST edition
   Dark violet ground, same class names (drop-in swap).
   Performance: no infinite paint-heavy animations, no
   @property spinners, no per-card staggered delays.
   ========================================================= */

:root{
  --bg:#0d0918;
  --bg-tint:#181229;
  --panel:#16102a;
  --panel2:#1b1433;
  --line:#2b2250;
  --line-soft:#221a40;
  --text:#f3eeff;
  --text-soft:#c9bfe6;
  --muted:#8f84b5;
  --accent:#8b5cf6;
  --accent-hi:#a78bfa;
  --accent-dim:#4a3a8c;
  --accent-deep:#6d28d9;
  --accent-glow:rgba(139,92,246,.28);
  --pink:#e879f9;
  --live:#10b981;
  --focus:#a78bfa;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --ease:cubic-bezier(.22,.8,.36,1);
  --spring:cubic-bezier(.34,1.3,.64,1);
  --font-body:"Inter","Sohne",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Playfair Display","Iowan Old Style",Georgia,serif;
  --purple-grad:linear-gradient(135deg,#6d28d9 0%,#8b5cf6 55%,#7c3aed 100%);
  --shadow-soft:0 18px 40px -22px rgba(0,0,0,.7);
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}

*{box-sizing:border-box}
html{
  /* gradient on <html> = painted once, never repainted on scroll */
  background:
    radial-gradient(60vmax 45vmax at 8% 0%,rgba(109,40,217,.28),transparent 65%),
    radial-gradient(50vmax 40vmax at 100% 6%,rgba(192,38,211,.16),transparent 65%),
    var(--bg);
  background-color:var(--bg);
  scroll-behavior:smooth;
  color-scheme:dark;
  scrollbar-color:var(--accent) var(--bg);
  scrollbar-width:thin;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
}
body:has(.modal.open){overflow:hidden}
img{max-width:100%}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--accent-dim);border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ---------- keyframes (only cheap ones: opacity / transform) ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- header ---------- */
.header{
  position:sticky;top:0;z-index:20;
  background:rgba(13,9,24,.96);
  border-bottom:1px solid var(--line);
}
.header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--accent-hi),var(--accent),var(--pink),var(--accent),var(--accent-hi),transparent);
  opacity:.8;
}
.nav{
  max-width:1400px;margin:auto;min-height:72px;
  display:flex;align-items:center;gap:22px;padding:12px 24px;
}
.header .logo{
  font-size:21px;font-weight:800;letter-spacing:.03em;white-space:nowrap;
  background:linear-gradient(90deg,#c4b5fd,#a78bfa 45%,#e879f9);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;
  transition:transform .3s var(--spring);
}
.header .logo:hover{transform:scale(1.05)}
.header .logo span{color:var(--pink);-webkit-text-fill-color:var(--pink)}

.search{flex:1;max-width:620px;margin:auto;position:relative}
.search input{
  width:100%;background:var(--bg-tint);border:1px solid var(--line);
  border-radius:999px;padding:13px 22px;color:var(--text);font:inherit;font-size:14px;
  outline:none;-webkit-appearance:none;appearance:none;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
}
.search input::placeholder{color:#7d72a6}
.search input:hover{border-color:var(--accent-dim)}
.search input:focus{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 4px var(--accent-glow)}

.sync{
  font-size:12px;color:var(--muted);white-space:nowrap;font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.sync::before{
  content:"";width:8px;height:8px;border-radius:50%;flex:none;
  background:var(--live);box-shadow:0 0 0 3px rgba(16,185,129,.2);
}

/* ---------- hero ---------- */
.hero{max-width:1400px;margin:0 auto;padding:64px 24px 30px;position:relative;animation:fadeUp .5s var(--ease) both}
.hero::before{
  content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:-1;
  width:300px;height:300px;right:4%;top:6px;
  background:radial-gradient(circle,rgba(139,92,246,.35),transparent 70%);
}
.hero::after{display:none}
.hero h1{
  font-family:var(--font-display);
  font-size:clamp(36px,5.4vw,70px);line-height:1.06;margin:0 0 18px;
  font-weight:700;letter-spacing:-.015em;
  background:linear-gradient(100deg,#ffffff 0%,#d8c8ff 45%,#a78bfa 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;
  text-wrap:balance;
}
.hero h1::after{
  content:"";display:block;width:84px;height:4px;margin-top:20px;border-radius:4px;
  background:var(--purple-grad);
  transform-origin:left;
  animation:growBar .6s .2s var(--ease) both;
}
.hero p{
  color:var(--text-soft);max-width:680px;line-height:1.75;margin:0;font-size:16px;text-wrap:pretty;
}

/* ---------- toolbar ---------- */
.toolbar{max-width:1400px;margin:auto;padding:12px 24px 24px;display:flex;gap:10px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--bg-tint);color:var(--text-soft);
  padding:9px 16px;border-radius:999px;cursor:pointer;
  font-size:13px;font-weight:600;letter-spacing:.01em;line-height:1.2;
  -webkit-user-select:none;user-select:none;
  transition:background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
}
.chip:active{transform:scale(.95)}
.chip.active{
  background:var(--purple-grad);
  color:#fff;border-color:var(--accent);font-weight:700;
}

/* ---------- grid & cards ---------- */
.grid{
  max-width:1400px;margin:auto;padding:0 24px 80px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;
}
.card{
  position:relative;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--radius-lg);
  overflow:hidden;cursor:pointer;
  box-shadow:0 10px 24px -16px rgba(0,0,0,.8);
  animation:fadeIn .3s ease both;   /* single cheap fade, no stagger */
  transition:transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.card:focus-visible{
  transform:translateY(-4px);
  border-color:var(--accent);
  box-shadow:0 18px 36px -18px rgba(139,92,246,.6), 0 0 0 1px var(--accent-glow);
}
.card:active{transform:scale(.98)}

.poster{
  aspect-ratio:2/3;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#231a45,#181229);
}
.poster img{
  width:100%;height:100%;object-fit:cover;display:block;
  position:relative;z-index:0;
  transition:transform .5s var(--ease);
}
.poster::after{
  content:"";position:absolute;inset:0;opacity:0;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(13,9,24,.05) 0%,rgba(13,9,24,.8) 100%);
  transition:opacity .25s var(--ease);
}
.poster::before{
  content:"";position:absolute;top:50%;left:50%;
  width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><path d='M24 19.5v21l17-10.5z' fill='%236d28d9'/></svg>") center/100% 100% no-repeat,
    rgba(255,255,255,.92);
  box-shadow:0 0 0 6px rgba(255,255,255,.14), 0 10px 26px rgba(0,0,0,.5);
  transform:scale(.7);opacity:0;z-index:2;pointer-events:none;
  transition:opacity .25s var(--ease), transform .3s var(--spring);
}
.badge{
  position:absolute;top:9px;left:9px;z-index:3;
  background:rgba(13,9,24,.82);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;
  font-size:10px;font-weight:700;letter-spacing:.03em;color:#d8c8ff;
}
.rating{
  position:absolute;right:9px;top:9px;z-index:3;
  background:var(--purple-grad);
  color:#fff;padding:5px 9px;border-radius:8px;font-size:10px;font-weight:800;
}
.poster .logo{
  position:absolute;left:9px;bottom:9px;z-index:3;
  max-width:calc(100% - 18px);
  background:rgba(13,9,24,.85);
  border:1.5px solid var(--accent);
  color:#e4d9ff;
  padding:8px 16px;border-radius:999px;
  font-size:18px;font-weight:800;letter-spacing:.02em;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .2s var(--ease), color .2s var(--ease);
}
.info{padding:14px 14px 15px;position:relative;z-index:1}
.title{
  font-size:13px;font-weight:700;line-height:1.4;letter-spacing:.005em;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  transition:color .2s var(--ease);
}
.meta{margin-top:8px;color:var(--muted);font-size:11px;letter-spacing:.02em;font-weight:500}
.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);padding:90px 20px;line-height:1.75;font-size:15px;
  animation:fadeUp .4s var(--ease) both;
}

@media (hover:hover){
  .chip:hover{border-color:var(--accent-hi);color:#fff;transform:translateY(-2px)}
  .chip.active:hover{color:#fff}
  .card:hover{
    transform:translateY(-6px);
    border-color:var(--accent);
    box-shadow:0 22px 40px -18px rgba(139,92,246,.55), 0 0 0 1px var(--accent-glow);
  }
  .card:hover .poster img{transform:scale(1.06)}
  .card:hover .poster::after{opacity:1}
  .card:hover .poster::before{opacity:1;transform:scale(1)}
  .card:hover .title{color:var(--accent-hi)}
  .card:hover .poster .logo{background:var(--accent);color:#fff}
}
.card:focus-visible .poster::after{opacity:1}
.card:focus-visible .poster::before{opacity:1;transform:scale(1)}

/* ---------- detail modal ---------- */
.modal{
  position:fixed;inset:0;
  background:rgba(6,3,14,.82);
  z-index:50;display:none;overflow:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.modal.open{display:block;animation:fadeIn .2s ease both}
.detail{
  position:relative;
  max-width:1100px;margin:50px auto;background:var(--panel);
  border:1px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px var(--accent-glow);
  animation:modalIn .35s var(--ease) both;
}
.detail::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;z-index:4;
  background:linear-gradient(90deg,var(--accent-deep),var(--accent),var(--pink),var(--accent-hi),var(--accent-deep));
}
.backdrop{height:320px;background-size:cover;background-position:center top;position:relative}
.backdrop::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(0deg,var(--panel) 0%, rgba(22,16,42,.7) 40%, transparent 80%),
    linear-gradient(90deg,rgba(22,16,42,.5),transparent 40%);
}
.close{
  position:absolute;z-index:5;right:18px;top:18px;
  border:1px solid var(--accent-dim);background:rgba(13,9,24,.8);color:#e4d9ff;
  border-radius:12px;padding:9px 13px;cursor:pointer;line-height:1;font-weight:700;
  transition:transform .25s var(--ease), background .2s var(--ease), color .2s var(--ease);
}
.close:hover{transform:rotate(90deg);background:var(--accent);color:#fff}
.close:active{transform:rotate(90deg) scale(.94)}

.detailBody{
  display:grid;grid-template-columns:190px 1fr;gap:28px;
  padding:0 30px 32px;margin-top:-100px;position:relative;z-index:2;
}
.detailPoster{
  width:190px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;
  border:2px solid var(--line);
  box-shadow:0 24px 48px -16px rgba(0,0,0,.85), 0 0 0 4px rgba(139,92,246,.18);
  animation:popIn .4s .1s var(--ease) both;
}
.detailText{padding-top:88px;min-width:0}
.detailText h2{
  font-family:var(--font-display);
  font-size:34px;margin:0 0 12px;line-height:1.15;letter-spacing:-.01em;font-weight:700;
  color:var(--text);
  text-wrap:balance;overflow-wrap:anywhere;
}
.desc{color:var(--text-soft);line-height:1.75;font-size:15px;text-wrap:pretty;max-width:70ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.tag{
  font-size:11px;font-weight:600;padding:6px 11px;border-radius:999px;
  background:var(--bg-tint);border:1px solid var(--line);color:var(--accent-hi);
  transition:border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
}
.tag:hover{border-color:var(--accent);color:#fff;background:var(--accent)}
.episodes{padding:0 30px 32px}
.episodes h3{
  margin:0 0 14px;font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--text);
  display:flex;align-items:center;gap:12px;
}
.episodes h3::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent-dim),transparent)}
.eps{display:flex;flex-wrap:wrap;gap:8px}
.ep{
  background:var(--bg-tint);border:1px solid var(--line);color:var(--text-soft);
  padding:9px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
  transition:border-color .2s var(--ease), background .2s var(--ease), transform .2s var(--ease), color .2s var(--ease);
}
.ep:hover, .ep:focus-visible{
  border-color:var(--accent);background:var(--purple-grad);color:#fff;
  transform:translateY(-2px);
}
.ep:active{transform:scale(.95)}

/* ---------- player ---------- */
.player{max-width:1200px;margin:30px auto;padding:0 20px;animation:fadeUp .4s var(--ease) both}
.playerBox{
  background:#000;border:1.5px solid var(--accent);border-radius:18px;
  overflow:hidden;aspect-ratio:16/9;
  box-shadow:0 0 0 1px var(--accent-glow), 0 24px 50px -28px rgba(0,0,0,.9);
}
.playerBox iframe{width:100%;height:100%;border:0;display:block}
.playerTitle{
  display:flex;justify-content:space-between;gap:20px;align-items:center;
  margin:20px 0;flex-wrap:wrap;
}
.playerTitle h2{
  margin:0;font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.005em;min-width:0;overflow-wrap:anywhere;
  color:var(--text);
}
.select{
  background:var(--bg-tint);border:1px solid var(--line);color:var(--text);font:inherit;
  border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.select:hover{border-color:var(--accent-hi)}
.select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow);outline:none}
.select option{background:var(--panel);color:var(--text)}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .backdrop{height:260px}
  .detailBody{grid-template-columns:150px 1fr;gap:20px;margin-top:-80px}
  .detailPoster{width:150px}
  .detailText{padding-top:70px}
  .detailText h2{font-size:28px}
}

@media(max-width:700px){
  .nav{padding:14px 16px;gap:14px;flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .hero{padding:40px 16px 20px}
  .hero h1::after{width:64px;margin-top:16px}
  .hero p{font-size:15px}
  .hero::before{width:200px;height:200px;right:0}

  .toolbar{
    padding:8px 16px 18px;flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
  }
  .toolbar::-webkit-scrollbar{display:none}
  .chip{flex:none;scroll-snap-align:start}

  .grid{padding:0 16px 56px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .poster .logo{font-size:14px;padding:6px 12px}

  .detail{margin:15px;border-radius:18px}
  .close{right:12px;top:12px;padding:8px 11px}
  .detailBody{
    grid-template-columns:96px 1fr;padding:0 16px 20px;
    gap:14px;margin-top:-52px;
  }
  .detailPoster{width:96px;border-radius:10px}
  .detailText{padding-top:56px}
  .detailText h2{font-size:21px;line-height:1.2}
  .desc{font-size:14px}
  .episodes{padding:0 16px 22px}
  .backdrop{height:190px}

  .player{padding:0 14px;margin:20px auto}
  .playerBox{border-radius:14px}
  .playerTitle h2{font-size:19px}
}

@media(max-width:420px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .info{padding:10px}
  .title{font-size:12px}
  .sync{font-size:11px}
}
@media (min-width:1600px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}

/* ===== Download Button ===== */
.dlBtn{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 20px;border-radius:999px;
  background:var(--purple-grad);color:#fff;
  font-weight:800;font-size:13px;letter-spacing:.02em;white-space:nowrap;
  border:1px solid var(--accent);cursor:pointer;
  box-shadow:0 8px 20px -10px rgba(139,92,246,.8);
  transition:transform .2s var(--ease), filter .2s var(--ease);
}
.dlBtn:active{transform:scale(.95)}
@media (hover:hover){
  .dlBtn:hover{transform:translateY(-2px);filter:brightness(1.12)}
}
@media (max-width:700px){
  .dlBtn{padding:8px 14px;font-size:12px}
}
.hero a.anylist-embed-btn,
.hero a.anylist-embed-btn:visited {
  display: inline-block;
  width: auto;
  margin-top: 22px;
  padding: 13px 24px;
  color: #ffffff;
  background: transparent;
  border: 1px solid #ffffff;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  line-height: 1.2;
  cursor: pointer;
  transition: all 0.25s ease;
}

.hero a.anylist-embed-btn:hover,
.hero a.anylist-embed-btn:focus-visible {
  color: #ffffff;
  background: #8b5cf6;
  border-color: #8b5cf6;
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
  transform: translateY(-2px);
}

/* NEW tag for recently added anime */
.newTag{
  position:absolute;left:9px;bottom:9px;z-index:3;
  background:#22c55e;color:#04210f;padding:4px 8px;border-radius:8px;
  font-size:10px;font-weight:800;letter-spacing:.06em;
}
</style>
</head>
<body>
<header class="header"><nav class="nav"><div class="logo">ANIME <span>EMBED</span></div><div class="search"><input id="search" placeholder="Search anime, genre, tag..."></div><a class="dlBtn" href="https://download-animeembeds.netlify.app/" target="_blank" rel="noopener noreferrer">Download APP</a><div class="sync" id="sync">Loading catalog...</div></nav></header>
<section class="hero"><h1>Watch Anime.</h1><p>Browse the synchronized catalog, open a title, choose an episode, and play the available embed supplied by the configured source.</p><a href="generate.html" target="_blank" rel="noopener noreferrer" class="anylist-embed-btn">Get All Anime Embeds</a></section>
<div class="toolbar" id="filters"></div>
<main class="grid" id="grid"><div class="empty">Loading...</div></main>

<div class="modal" id="detailModal"><div class="detail" id="detail"></div></div>
<div class="modal" id="playerModal"><div class="player"><button class="close" onclick="closePlayer()">Close</button><div class="playerBox" id="playerBox"></div><div class="playerTitle"><h2 id="playerTitle"></h2><select class="select" id="episodeSelect"></select></div></div></div>

<script>
let catalog=[], currentFilter="All";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(){
  try{
    const r=await fetch("/api/catalog"); const j=await r.json();
    const list=j.anime||[];
    // Recently added anime (last 30 days) go first, everything else keeps catalog order.
    const now=Date.now(), DAY=864e5;
    list.forEach(a=>{const t=Date.parse(a.addedAt||""); a._new=!isNaN(t)&&now-t<30*DAY; a._t=a._new?t:0;});
    catalog=list.map((a,i)=>({a,i})).sort((x,y)=>(y.a._t-x.a._t)||(x.i-y.i)).map(x=>x.a);
    renderFilters(); render();
    const st=j.sync||{};
    $("#sync").textContent=st.ok&&st.lastSync ? "Synced "+new Date(st.lastSync).toLocaleTimeString() : "Saved catalog";
  }catch(e){
    if(!catalog.length) $("#grid").innerHTML=`<div class="empty">Could not load catalog. Please refresh.</div>`;
    $("#sync").textContent="Offline";
  }
}
function renderFilters(){
  const cats=["All","series","movie","drama"];
  $("#filters").innerHTML=cats.map(x=>`<button class="chip ${currentFilter===x?"active":""}" onclick="setFilter('${x}')">${x==="All"?"All":x[0].toUpperCase()+x.slice(1)}</button>`).join("");
}
function setFilter(x){currentFilter=x;renderFilters();render()}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  const list=catalog.filter(a=>{
    const blob=[a.title,a.description,a.language,a.category,...(a.tags||[]),...(a.genres||[])].join(" ").toLowerCase();
    return (currentFilter==="All"||a.category===currentFilter)&&(!q||blob.includes(q));
  });
  $("#grid").innerHTML=list.length?list.map(card).join(""):`<div class="empty">No anime found.</div>`;
}
function card(a){
  const index=catalog.indexOf(a);
  return `<article class="card" onclick="openDetailByIndex(${index})">
    <div class="poster"><img loading="lazy" src="${esc(a.posterUrl)}" alt="" onerror="this.style.opacity='.15'">
      <span class="badge">${esc(a.language||a.category||"Anime")}</span>${a._new?'<span class="newTag">NEW</span>':""}<span class="rating">★ ${esc(a.rating||"0")}</span>
    </div><div class="info"><div class="title">${esc(a.title)}</div><div class="meta">${esc(a.year||"")} · ${esc(a.episodeCount||getEpisodes(a).length||"")} episodes</div></div>
  </article>`;
}
function getEpisodes(a){
  const existing=Array.isArray(a.episodes)?a.episodes:[];
  if(existing.length){
    return existing.map((e,i)=>({
      ...e,
      number:Number(e.number||i+1),
      embedUrl:e.embedUrl || buildEmbedUrl(a, Number(e.number||i+1))
    }));
  }

  const count=Math.max(
    0,
    Number(a.episodeCount||a.totalEpisodes||0)
  );

  if(!count || !a.tmdbId) return [];

  const season=Math.max(1, Number(a.seasonNumber||1));
  return Array.from({length:count},(_,i)=>({
    number:i+1,
    embedUrl:buildEmbedUrl(a,i+1)
  }));
}

function buildEmbedUrl(a,episode){
  const id=a.tmdbId || a.sourceId;
  const season=Math.max(1,Number(a.seasonNumber||1));
  if(!id) return "";
  return `https://blakiteapi.xyz/embed/${encodeURIComponent(id)}/${season}-${episode}`;
}

function openDetailByIndex(index){
  const a=catalog[index];
  if(a) openDetail(a);
}

function openDetail(a){
  const eps=getEpisodes(a);
  $("#detail").innerHTML=`<div class="backdrop" style="background-image:url('${esc(a.backdropUrl||a.posterUrl||"")}')"><button class="close" onclick="closeDetail()">Close</button></div>
  <div class="detailBody"><img class="detailPoster" src="${esc(a.posterUrl)}" alt=""><div class="detailText">
    <h2>${esc(a.title)}</h2><div class="meta">${esc(a.year||"Unknown")} · ${esc(a.status||"")} · ${esc(a.language||"")} · ★ ${esc(a.rating||"0")}</div>
    <div class="tags">${[...(a.tags||[]),...(a.genres||[])].slice(0,18).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    <p class="desc">${esc(a.description||"No description available.")}</p>
  </div></div>
  <div class="episodes"><h3>Episodes</h3><div class="eps">${eps.length?eps.map((e,i)=>`<button class="ep" onclick="openPlayerByIndex(${catalog.indexOf(a)},${i})">EP ${esc(e.number||i+1)}</button>`).join(""):"<span class='meta'>Episode embeds are generated from the source ID and season/episode pattern.</span>"}</div></div>`;
  $("#detailModal").classList.add("open");
}
function closeDetail(){$("#detailModal").classList.remove("open")}
function openPlayerByIndex(animeIndex,index){
  const a=catalog[animeIndex];
  if(a) openPlayer(a,index);
}
function openPlayer(a,index){
  const eps=getEpisodes(a); const e=eps[index]; if(!e) return;
  $("#playerTitle").textContent=`${a.title} — Episode ${e.number||index+1}`;
  $("#episodeSelect").innerHTML=eps.map((x,i)=>`<option value="${i}" ${i===index?"selected":""}>Episode ${x.number||i+1}</option>`).join("");
  $("#episodeSelect").onchange=()=>openPlayer(a,Number($("#episodeSelect").value));
  const embedUrl=e.embedUrl || buildEmbedUrl(a, Number(e.number||index+1));
  $("#playerBox").innerHTML=embedUrl
    ? `<iframe src="${esc(embedUrl)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>`
    : `<div style="height:100%;display:grid;place-items:center;color:#aaa">No embed URL available.</div>`;
  closeDetail(); $("#playerModal").classList.add("open");
}
function closePlayer(){ $("#playerModal").classList.remove("open"); $("#playerBox").innerHTML=""; }
$("#search").addEventListener("input",render);
load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
