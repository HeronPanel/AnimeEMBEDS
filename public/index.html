<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIME EMBED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--panel:#10121a;--panel2:#151824;--line:#242837;--text:#f7f7fb;--muted:#9499ab;--accent:#8b5cf6;--accent2:#c084fc}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#29194b 0,transparent 60%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}
.header{position:sticky;top:0;z-index:20;background:rgba(7,8,13,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{max-width:1400px;margin:auto;height:72px;display:flex;align-items:center;gap:22px;padding:0 24px}.logo{font-size:20px;font-weight:800;letter-spacing:.08em}.logo span{color:var(--accent2)}
.search{flex:1;max-width:620px;margin:auto}.search input{width:100%;background:#0e1017;border:1px solid var(--line);border-radius:12px;padding:13px 16px;color:#fff;outline:none}.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.hero{max-width:1400px;margin:0 auto;padding:54px 24px 28px}.hero h1{font-size:clamp(34px,5vw,64px);line-height:1;margin:0 0 14px}.hero p{color:var(--muted);max-width:760px;line-height:1.7;margin:0}
.toolbar{max-width:1400px;margin:auto;padding:12px 24px 22px;display:flex;gap:9px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#0d0f16;color:#b8bdce;padding:9px 13px;border-radius:999px;cursor:pointer}.chip.active{background:#7c3aed;color:#fff;border-color:#8b5cf6}
.grid{max-width:1400px;margin:auto;padding:0 24px 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}.card{background:linear-gradient(180deg,#131620,#0d0f15);border:1px solid var(--line);border-radius:15px;overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-5px);border-color:#5d4a7d}.poster{aspect-ratio:2/3;background:#171923;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.75);border:1px solid #353849;border-radius:7px;padding:5px 7px;font-size:10px}.rating{position:absolute;right:9px;top:9px;background:#f59e0b;color:#111;padding:5px 7px;border-radius:7px;font-size:10px;font-weight:800}.info{padding:12px}.title{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{margin-top:8px;color:var(--muted);font-size:11px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(10px);z-index:50;display:none;overflow:auto}.modal.open{display:block}.detail{max-width:1100px;margin:50px auto;background:#0e1017;border:1px solid var(--line);border-radius:20px;overflow:hidden}.backdrop{height:300px;background-size:cover;background-position:center;position:relative}.backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0e1017,transparent 75%)}.close{position:absolute;z-index:2;right:18px;top:18px;border:1px solid #45495a;background:#11131a;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.detailBody{display:grid;grid-template-columns:190px 1fr;gap:26px;padding:0 28px 30px;margin-top:-100px;position:relative;z-index:2}.detailPoster{width:190px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.detailText{padding-top:88px}.detailText h2{font-size:32px;margin:0 0 12px}.desc{color:#b3b7c7;line-height:1.7}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.tag{font-size:11px;padding:6px 8px;border-radius:7px;background:#171a24;border:1px solid #292d3c;color:#b9bfd0}.episodes{padding:0 28px 30px}.episodes h3{margin-top:0}.eps{display:flex;flex-wrap:wrap;gap:8px}.ep{background:#171a24;border:1px solid #2b3040;color:#ddd;padding:9px 12px;border-radius:9px;cursor:pointer}.ep:hover{border-color:#8b5cf6}
.player{max-width:1200px;margin:30px auto;padding:0 20px}.playerBox{background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden;aspect-ratio:16/9}.playerBox iframe{width:100%;height:100%;border:0}.playerTitle{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:18px 0}.playerTitle h2{margin:0}.select{background:#11131a;border:1px solid var(--line);color:#fff;border-radius:9px;padding:10px}
@media(max-width:700px){.nav{height:auto;padding:15px 16px;flex-wrap:wrap}.search{order:3;flex-basis:100%}.hero{padding:38px 16px 20px}.grid{padding:0 16px 50px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detail{margin:15px}.detailBody{grid-template-columns:110px 1fr;padding:0 16px 22px;gap:15px;margin-top:-55px}.detailPoster{width:110px}.detailText{padding-top:52px}.detailText h2{font-size:20px}.episodes{padding:0 16px 22px}.backdrop{height:210px}}
</style>
</head>
<body>
<header class="header"><nav class="nav"><div class="logo">ANIME <span>EMBED</span></div><div class="search"><input id="search" placeholder="Search anime, genre, tag..."></div><div class="sync" id="sync">Loading catalog...</div></nav></header>
<section class="hero"><h1>Watch Anime.</h1><p>Browse the synchronized catalog, open a title, choose an episode, and play the available embed supplied by the configured source.</p></section>
<div class="toolbar" id="filters"></div>
<main class="grid" id="grid"><div class="empty">Loading...</div></main>

<div class="modal" id="detailModal"><div class="detail" id="detail"></div></div>
<div class="modal" id="playerModal"><div class="player"><button class="close" onclick="closePlayer()">Close</button><div class="playerBox" id="playerBox"></div><div class="playerTitle"><h2 id="playerTitle"></h2><select class="select" id="episodeSelect"></select></div></div></div>

<script>
let catalog=[], currentFilter="All";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(){
  const r=await fetch("/api/catalog"); const j=await r.json();
  catalog=j.anime||[]; renderFilters(); render();
  const st=await fetch("/api/sync-status").then(r=>r.json()).catch(()=>({}));
  $("#sync").textContent=st.lastSync ? "Synced "+new Date(st.lastSync).toLocaleTimeString() : "Local catalog";
}
function renderFilters(){
  const cats=["All","series","movie","drama"];
  $("#filters").innerHTML=cats.map(x=>`<button class="chip ${currentFilter===x?"active":""}" onclick="setFilter('${x}')">${x==="All"?"All":x[0].toUpperCase()+x.slice(1)}</button>`).join("");
}
function setFilter(x){currentFilter=x;renderFilters();render()}
function render(){
  const q=$("#search").value.trim().toLowerCase();
  const list=catalog.filter(a=>{
    const blob=[a.title,a.description,a.language,a.category,...(a.tags||[]),...(a.genres||[])].join(" ").toLowerCase();
    return (currentFilter==="All"||a.category===currentFilter)&&(!q||blob.includes(q));
  });
  $("#grid").innerHTML=list.length?list.map(card).join(""):`<div class="empty">No anime found.</div>`;
}
function card(a){
  return `<article class="card" onclick="openDetail(${JSON.stringify(a).replace(/</g,"\\u003c")})">
    <div class="poster"><img loading="lazy" src="${esc(a.posterUrl)}" alt="" onerror="this.style.opacity='.15'">
      <span class="badge">${esc(a.language||a.category||"Anime")}</span><span class="rating">★ ${esc(a.rating||"0")}</span>
    </div><div class="info"><div class="title">${esc(a.title)}</div><div class="meta">${esc(a.year||"")} · ${esc(a.episodeCount||((a.episodes||[]).length)||"")} episodes</div></div>
  </article>`;
}
function openDetail(a){
  const eps=a.episodes||[];
  $("#detail").innerHTML=`<div class="backdrop" style="background-image:url('${esc(a.backdropUrl||a.posterUrl||"")}')"><button class="close" onclick="closeDetail()">Close</button></div>
  <div class="detailBody"><img class="detailPoster" src="${esc(a.posterUrl)}" alt=""><div class="detailText">
    <h2>${esc(a.title)}</h2><div class="meta">${esc(a.year||"Unknown")} · ${esc(a.status||"")} · ${esc(a.language||"")} · ★ ${esc(a.rating||"0")}</div>
    <div class="tags">${[...(a.tags||[]),...(a.genres||[])].slice(0,18).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    <p class="desc">${esc(a.description||"No description available.")}</p>
  </div></div>
  <div class="episodes"><h3>Episodes</h3><div class="eps">${eps.length?eps.map((e,i)=>`<button class="ep" onclick='openPlayer(${JSON.stringify(a).replace(/</g,"\\u003c")},${i})'>EP ${esc(e.number||i+1)}</button>`).join(""):"<span class='meta'>No episode embed is present in the local catalog for this title.</span>"}</div></div>`;
  $("#detailModal").classList.add("open");
}
function closeDetail(){$("#detailModal").classList.remove("open")}
function openPlayer(a,index){
  const eps=a.episodes||[]; const e=eps[index]; if(!e) return;
  $("#playerTitle").textContent=`${a.title} — Episode ${e.number||index+1}`;
  $("#episodeSelect").innerHTML=eps.map((x,i)=>`<option value="${i}" ${i===index?"selected":""}>Episode ${x.number||i+1}</option>`).join("");
  $("#episodeSelect").onchange=()=>openPlayer(a,Number($("#episodeSelect").value));
  // Only render an iframe for an explicit embed URL already present in the catalog.
  $("#playerBox").innerHTML=e.embedUrl?`<iframe src="${esc(e.embedUrl)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>`:`<div style="height:100%;display:grid;place-items:center;color:#aaa">No embed URL available.</div>`;
  closeDetail(); $("#playerModal").classList.add("open");
}
function closePlayer(){ $("#playerModal").classList.remove("open"); $("#playerBox").innerHTML=""; }
$("#search").addEventListener("input",render);
load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
